sdk: docker
app_file: start.sh

docker:
  base_image: python:3.11-slim
  system_packages:
    - git
    - curl
  files:
    - config.yaml
    - requirements.txt
    - start.sh
    - agent/
    - web/
    - memory/
  env:
    NEXUS_VERSION: "0.2.0"
    PYTHONUNBUFFERED: "1"
    HOST: "0.0.0.0"
    PORT: 7860
  port: 7860